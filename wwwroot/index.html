<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cupcakeria</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>🧁 Cupcakeria</h1>
    <p>🛒 Carrinho: <span id="contador-carrinho">0</span> item(ns)</p>
  </header>
  <main>
    <h2>Nosso catálogo</h2>
    <p id="mensagem">Carregando...</p>
    <div id="catalogo" class="grid"></div>

    <section id="carrinho">
      <h2>Seu carrinho</h2>
      <div id="itens-carrinho"></div>
      <p class="total">Total: <span id="total-carrinho">R$ 0,00</span></p>

      <h3>Finalizar pedido</h3>
      <label for="nome-cliente">Seu nome</label>
      <input id="nome-cliente" type="text" maxlength="100">
      <label for="endereco-cliente">Endereço de entrega</label>
      <input id="endereco-cliente" type="text" maxlength="200">
      <button id="btn-finalizar" class="btn">Finalizar pedido</button>
      <p id="mensagem-pedido"></p>
    </section>
  </main>

  <script src="carrinho.js"></script>
  <script src="catalogo.js"></script>
  <script src="pedido.js"></script>
</body>
</html>
