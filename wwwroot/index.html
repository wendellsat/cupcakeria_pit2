<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cupcakeria</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fdf2ec; margin: 0; color: #4a2c1d; }
    header { background: #7a2e12; color: #fff; padding: 20px; text-align: center; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    .card h3 { margin-top: 0; }
    .preco { font-weight: bold; font-size: 1.2em; color: #7a2e12; }
  </style>
</head>
<body>
  <header><h1>🧁 Cupcakeria</h1></header>
  <main>
    <h2>Nosso catálogo</h2>
    <p id="mensagem">Carregando...</p>
    <div id="catalogo" class="grid"></div>
  </main>

  <script>
    async function carregarCatalogo() {
      const mensagem = document.getElementById("mensagem");
      const catalogo = document.getElementById("catalogo");

      try {
        const resposta = await fetch("/api/cupcakes");
        if (!resposta.ok) throw new Error("Falha ao buscar o catálogo");
        const cupcakes = await resposta.json();

        mensagem.textContent = "";
        for (const c of cupcakes) {
          const card = document.createElement("div");
          card.className = "card";

          const nome = document.createElement("h3");
          nome.textContent = c.nome;

          const descricao = document.createElement("p");
          descricao.textContent = c.descricao;

          const preco = document.createElement("p");
          preco.className = "preco";
          preco.textContent = "R$ " + c.preco.toFixed(2).replace(".", ",");

          card.append(nome, descricao, preco);
          catalogo.appendChild(card);
        }
      } catch (erro) {
        mensagem.textContent = "Não foi possível carregar o catálogo. Tente novamente mais tarde.";
      }
    }

    carregarCatalogo();
  </script>
</body>
</html>
